file_type: trial_balance
source_erp: economic
target_template: trial_balance.xlsx

source_sheet: 0
header_row: 0
skip_footer_rows: 0

mappings:
  - source: "Account number"
    target: "account_number"
    transform: strip_whitespace

  - source: "Account name"
    target: "account_name"
    transform: strip_whitespace

  - source: "Debit"
    target: "debit_amount"
    transform: parse_currency
    params:
      thousands_separator: "."
      decimal_separator: ","

  - source: "Credit"
    target: "credit_amount"
    transform: parse_currency
    params:
      thousands_separator: "."
      decimal_separator: ","

  - source: null
    target: "currency"
    transform: constant
    params:
      value: "DKK"

  - source: null
    target: "period"
    transform: constant
    params:
      value: ""

validations:
  - validator: debit_credit_balance
    severity: error
    params:
      debit_column: "debit_amount"
      credit_column: "credit_amount"
      tolerance: 0.01

  - validator: required_fields
    severity: error
    params:
      fields: ["account_number", "account_name"]

  - validator: no_duplicates
    severity: warning
    params:
      columns: ["account_number"]

post_transforms:
  - transform: sort_by
    params:
      columns: ["account_number"]
      ascending: true
