file_type: open_ap
source_erp: economic
target_template: open_ap.xlsx

source_sheet: 0
header_row: 0

drop_rows_missing_all:
  - vendor_number
  - invoice_number

mappings:
  - sources:
      - "Supplier"
      - "Supplier number"
      - "Vendor"
      - "Vendor number"
      - "Leverantor"
    target: "vendor_number"
    transform: strip_whitespace

  - sources:
      - "Invoice number"
      - "Invoice nr"
      - "Invoice no"
      - "Fortnox invoice nr"
      - "Fakturanr"
      - "Fakturanummer"
    target: "invoice_number"
    transform: clean_identifier

  - sources:
      - "Due date"
      - "Forfdat"
      - "Forfallodatum"
      - "Forfallsdatum"
    target: "due_date"
    transform: normalize_date
    params:
      output_format: "%Y-%m-%d"

  - sources:
      - "Saldo"
      - "Amount"
      - "Belopp"
      - "Saldo i SEK"
      - "Belopp i SEK"
    target: "amount"
    transform: parse_currency

  - sources:
      - "Currency"
      - "Valuta"
    target: "currency"
    transform: uppercase

validations:
  - validator: required_fields
    severity: error
    params:
      fields: ["vendor_number", "invoice_number", "amount"]
